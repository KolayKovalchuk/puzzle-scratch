steps:
  - name: gcr.io/cloud-builders/gcloud
    id: Build telegram webhook
    entrypoint: gcloud
    args: 
    - functions
    - deploy
    - telegramWebhook
    - --entry-point=handleWebhook
    - --source=dist
    - --runtime=nodejs22
    - --trigger-http
    - --region=us-central1
    - --allow-unauthenticated
    - --set-secrets=TELEGRAM_INTERNAL_COMM_AUTH_TOKEN=TELEGRAM_INTERNAL_COMM_AUTH_TOKEN:latest
