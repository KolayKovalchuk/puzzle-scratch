steps:
  - name: gcr.io/cloud-builders/gcloud
    id: Build telegram webhook
    entrypoint: gcloud
    args: 
    - functions
    - deploy
    - telegramWebhookDev
    - --entry-point=handleWebhook
    - --source=dist
    - --runtime=nodejs22
    - --trigger-http
    - --region=us-central1
    - --allow-unauthenticated
    # - --env-vars-file=.env.yaml
    # - --update-labels=dependencies=updated
  - name: gcr.io/cloud-builders/gcloud
    id: Build set telegram webhook url
    entrypoint: gcloud
    args: 
    - functions
    - deploy
    - setWebhookDev
    - --entry-point=setWebhook
    - --source=dist
    - --runtime=nodejs22
    - --trigger-http
    - --region=us-central1
    - --allow-unauthenticated
    # - --env-vars-file=.env.yaml
    # - --update-labels=dependencies=updated
  - name: gcr.io/cloud-builders/gcloud
    id: Build get telegram webhook url
    entrypoint: gcloud
    args: 
    - functions
    - deploy
    - getWebhookDev
    - --entry-point=getWebhook
    - --source=dist
    - --runtime=nodejs22
    - --trigger-http
    - --region=us-central1
    - --allow-unauthenticated
    # - --env-vars-file=.env.yaml
    # - --update-labels=dependencies=updated
