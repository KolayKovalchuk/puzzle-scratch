stages:
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

build:
  stage: build
  image: node:16
  script:
    - npm install
    - |
      if [[ "$CI_COMMIT_REF_NAME" =~ ^release.*|^hotfix.* ]]; then
        npm run build:prod
      elif [[ "$CI_COMMIT_REF_NAME" =~ ^main$|^development$ ]]; then
        npm run build:dev
      else
        echo "No valid branch"; exit 1
      fi
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^main$/'
    - if: '$CI_COMMIT_REF_NAME =~ /^development$/'
    - if: '$CI_COMMIT_REF_NAME =~ /^release.*$/'
    - if: '$CI_COMMIT_REF_NAME =~ /^hotfix.*$/'

deploy:
  stage: deploy
  image: google/cloud-sdk:latest
  dependencies:
    - build
  before_script:
    - echo $BASE64_GOOGLE_CLOUD_CREDENTIALS | base64 -d > service-account-key.json
    - gcloud auth activate-service-account --key-file service-account-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - |
      if [[ "$CI_COMMIT_REF_NAME" =~ ^release.*|^hotfix.* ]]; then
        DEPLOY_BUCKET="gs://puzzle-ui"
        RSYNC_FLAGS=""
      elif [[ "$CI_COMMIT_REF_NAME" =~ ^main$|^development$ ]]; then
        DEPLOY_BUCKET="gs://puzzle-ui-dev-0"
        RSYNC_FLAGS="-d"
      else
        echo "No valid branch"; exit 1
      fi
  script:
    - gsutil -m rsync $RSYNC_FLAGS -r dist $DEPLOY_BUCKET
    - gsutil setmeta -h "Cache-Control:no-cache, max-age=0" $DEPLOY_BUCKET/index.html
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^main$/'
    - if: '$CI_COMMIT_REF_NAME =~ /^development$/'
    - if: '$CI_COMMIT_REF_NAME =~ /^release.*$/'
    - if: '$CI_COMMIT_REF_NAME =~ /^hotfix.*$/'
